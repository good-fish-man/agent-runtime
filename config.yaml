# agent-runtime configuration
server:
  grpc_addr: ":18080"
  http_addr: ":18081"
  default_model:
    provider: "openai"
    name: "gpt-4o-mini"
    api_key: "${DEFAULT_API_KEY}"
    api_base: "https://api.openai.com/v1"

db:
  enabled: true
  db_type: "postgres"
  username: "postgres"
  password: "a123456"
  db_host: "localhost"
  db_port: 5432
  db_name: "agent_runtime"
  ssl_mode: "disable"

memory:
  enabled: true
  auto_migrate: true
  inject_into_prompt: true
  background_review: true
  max_review_memory: 10

research:
  enabled: true
  providers: ["web", "github", "wikipedia", "arxiv", "news"]
  max_queries: 6
  max_pages: 8
  max_rounds: 3
  results_per_query: 5
  timeout_sec: 30
  cache_ttl_min: 60
  news_cache_ttl_min: 5
  provider_timeout_sec: 10
  provider_failure_threshold: 3
  circuit_open_sec: 120
  model_planning: true
  semantic_verification: true
  advisor_timeout_sec: 8
  max_advisor_claims: 8

# Host file search and application launch. Enable only on a trusted local
# desktop installation; keep disabled on shared or remotely hosted runtimes.
skills:
  dir: "skills"
  config_path: "config/skills-config.yaml"

# Packages are read from ~/.athena/plugins by default. Only ACTIVE Registry
# entries with an exact digest and trusted Ed25519 signature are loaded.
plugins:
  enabled: true
  require_signature: true

# Production admission control. Work beyond max_inflight waits in a bounded
# queue and is rejected instead of exhausting the process.
operations:
  max_inflight: 32
  max_queue: 64
  admission_wait_ms: 2000
  request_timeout_sec: 300
