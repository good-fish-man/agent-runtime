# agent-runtime configuration
server:
  grpc_addr: ":18080"
  http_addr: ":18081"
  default_model:
    provider: "openai"
    name: "gpt-4o-mini"
    api_key: "${DEFAULT_API_KEY}"
    api_base: "https://api.openai.com/v1"

db:
  enabled: true
  db_type: "postgres"
  username: "postgres"
  password: "a123456"
  db_host: "localhost"
  db_port: 5432
  db_name: "agent_runtime"
  ssl_mode: "disable"

memory:
  enabled: true
  auto_migrate: true
  inject_into_prompt: true
  background_review: true
  max_review_memory: 10

# Host file search and application launch. Enable only on a trusted local
# desktop installation; keep disabled on shared or remotely hosted runtimes.
skills:
  dir: "skills"
  config_path: "config/skills-config.yaml"
