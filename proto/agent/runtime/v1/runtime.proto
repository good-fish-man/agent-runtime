syntax = "proto3";

package agent.runtime.v1;

option go_package = "agent-runtime/gen/agent/runtime/v1;runtimev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ============================================================
// Service
// ============================================================
service AgentRuntime {
  rpc Run(RunRequest) returns (RunResponse);
  rpc RunStream(RunRequest) returns (stream StreamEvent);
  rpc RunAgent(AgentRequest) returns (AgentResponse);
  rpc RunAgentStream(AgentRequest) returns (stream StreamEvent);
  rpc GenerateMedia(MediaGenerationRequest) returns (MediaGenerationResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
}

// ============================================================
// Enums
// ============================================================
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
}

enum ModelRole {
  MODEL_ROLE_UNSPECIFIED = 0;
  MODEL_ROLE_DEFAULT = 1;
  MODEL_ROLE_REWRITE = 2;
  MODEL_ROLE_SKILL = 3;
  MODEL_ROLE_SUMMARIZE = 4;
}

enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  MEMORY_TYPE_USER = 1;
  MEMORY_TYPE_FEEDBACK = 2;
  MEMORY_TYPE_PROJECT = 3;
  MEMORY_TYPE_REFERENCE = 4;
}

enum BusinessErrorCode {
  BUSINESS_ERROR_CODE_UNSPECIFIED = 0;
  BUSINESS_ERROR_CODE_MODEL_NOT_CONFIGURED = 1;
  BUSINESS_ERROR_CODE_MODEL_CALL_FAILED = 2;
  BUSINESS_ERROR_CODE_TOOL_EXECUTION_FAILED = 3;
  BUSINESS_ERROR_CODE_SANDBOX_ERROR = 4;
  BUSINESS_ERROR_CODE_APPROVAL_REQUIRED = 5;
  BUSINESS_ERROR_CODE_CHECKPOINT_NOT_FOUND = 6;
  BUSINESS_ERROR_CODE_RATE_LIMITED = 7;
  BUSINESS_ERROR_CODE_MAX_ITERATIONS_EXCEEDED = 8;
  BUSINESS_ERROR_CODE_CONTEXT_TOO_LONG = 9;
}

// ============================================================
// Core messages
// ============================================================
message ChatMessage {
  string role = 1;
  string content = 2;
}

message RunRequest {
  string prompt = 1;
  map<string, ModelConfig> models = 2;
  repeated ChatMessage messages = 3;
  google.protobuf.Struct context = 4;
  repeated KnowledgeBaseConfig knowledge_bases = 5;
  repeated Skill skills = 6;
  repeated MCPConfig mcps = 7;
  repeated CLIConfig clis = 8;
  repeated A2AAgentConfig a2a = 9;
  repeated CapabilityConfig capabilities = 10;
  repeated InternalAgentConfig internal_agents = 11;
  repeated SubAgentConfig sub_agents = 12;
  RunOptions options = 13;
  SandboxConfig sandbox = 14;
  repeated FileConfig files = 15;
  string request_id = 16;
  string trace_id = 17;
  repeated VisualInput visual_inputs = 18;
}

message RunResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  repeated A2AResult a2a_results = 3;
  int32 tokens_used = 4;
  string finish_reason = 5;
  ResponseMetadata metadata = 6;
  repeated google.protobuf.Struct a2ui_messages = 7;
  repeated PendingApproval pending_approvals = 8;
  string checkpoint_id = 9;
  repeated MemoryEntry memories = 10;
  string trace_id = 11;
}

message AgentRequest {
  string task = 1;
  google.protobuf.Struct context = 2;
  map<string, ModelConfig> models = 3;
  bool stream = 4;
  string request_id = 5;
  string trace_id = 6;
  repeated CapabilityConfig capabilities = 7;
  repeated VisualInput visual_inputs = 8;
}

message AgentResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  int32 tokens_used = 3;
  string finish_reason = 4;
  ResponseMetadata metadata = 5;
  string error = 6;
  string trace_id = 7;
}

message MediaGenerationRequest {
  ModelConfig model = 1;
  string media_type = 2;
  string operation = 3;
  string prompt = 4;
  string negative_prompt = 5;
  string source_url = 6;
  string size = 7;
  string quality = 8;
  int32 duration_seconds = 9;
  string request_id = 10;
  string trace_id = 11;
}

message MediaGenerationResponse {
  string media_url = 1;
  string media_type = 2;
  string mime_type = 3;
  string provider_job_id = 4;
  string trace_id = 5;
}

message ResumeRequest {
  string checkpoint_id = 1;
  repeated ResumeApproval approvals = 2;
  string request_id = 3;
  string trace_id = 4;
}

message ResumeApproval {
  string interrupt_id = 1;
  bool approved = 2;
  optional string disapprove_reason = 3;
}

message ResumeResponse {
  bool success = 1;
  string error = 2;
  string finish_reason = 3;
  string content = 4;
  repeated ToolCall tool_calls = 5;
  ResponseMetadata metadata = 6;
  repeated PendingApproval pending_approvals = 7;
  string checkpoint_id = 8;
  string trace_id = 9;
}

message StopRequest {
  string checkpoint_id = 1;
  string session_id = 2;
  string trace_id = 3;
}

message StopResponse {
  bool stopped = 1;
  string message = 2;
  string trace_id = 3;
}

message HealthCheckRequest {
  string service = 1;
  string trace_id = 2;
}

message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string version = 2;
  string trace_id = 3;
}

// ============================================================
// Config messages
// ============================================================
message ModelConfig {
  string provider = 1;
  string name = 2;
  string api_key = 3;
  string api_base = 4;
  double temperature = 5;
  int32 max_tokens = 6;
  double top_p = 7;
  google.protobuf.Struct extra_fields = 8;
}

message RunOptions {
  double temperature = 1;
  int32 max_tokens = 2;
  bool stream = 3;
  double top_p = 4;
  repeated string stop = 5;
  int32 timeout_ms = 6;
  int32 max_iterations = 7;
  int32 max_tool_calls = 8;
  int32 max_a2a_calls = 9;
  int32 max_total_tokens = 10;
  RetryConfig retry = 11;
  ResponseSchemaConfig response_schema = 12;
  RoutingConfig routing = 13;
  ApprovalPolicy approval_policy = 14;
  string checkpoint_id = 15;
}

message RetryConfig {
  int32 max_attempts = 1;
  int32 initial_delay_ms = 2;
  int32 max_delay_ms = 3;
  double backoff_multiplier = 4;
  repeated string retryable_errors = 5;
  int32 circuit_breaker_threshold = 6;
  int32 circuit_breaker_duration_ms = 7;
}

message RoutingConfig {
  ModelRole default_model = 1;
  string rewrite_prompt = 2;
  string summarize_prompt = 3;
}

message ResponseSchemaConfig {
  string type = 1;
  string version = 2;
  bool strict = 3;
  google.protobuf.Struct schema = 4;
  string fallback = 5;
}

message ApprovalPolicy {
  bool enabled = 1;
  RiskLevel risk_threshold = 2;
  repeated string auto_approve = 3;
}

message VolumeMount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

message SandboxLimits {
  string cpu = 1;
  string memory = 2;
}

message SandboxConfig {
  bool enabled = 1;
  string mode = 2;
  string image = 3;
  string workdir = 4;
  string network = 5;
  int32 timeout_ms = 6;
  map<string, string> env = 7;
  SandboxLimits limits = 8;
  repeated VolumeMount volumes = 9;
}

message Skill {
  string id = 1;
  string name = 2;
  string description = 3;
  string instruction = 4;
  string scope = 5;
  string trigger = 6;
  string entry_script = 7;
  string file_path = 8;
  repeated string inputs = 9;
  repeated string outputs = 10;
  RiskLevel risk_level = 11;
  repeated string output_patterns = 12;
}

message SkillOutputFile {
  string name = 1;
  string base64 = 2;
  string mime = 3;
}

message MCPConfig {
  string name = 1;
  string transport = 2;
  string command = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  string endpoint = 6;
  map<string, string> headers = 7;
  RiskLevel risk_level = 8;
}

message CLIConfig {
  string name = 1;
  string command = 2;
  string config_dir = 3;
  string skills_dir = 4;
  RiskLevel risk_level = 5;
  string auth_type = 6;
}

// CapabilityConfig selects a stable provider-independent ability. Concrete
// providers are Runtime implementation details and are not part of this contract.
message CapabilityConfig {
  string id = 1;
  google.protobuf.Struct config = 2;
}

message ListCapabilitiesRequest {
  string trace_id = 1;
}

message CapabilityDefinition {
  string id = 1;
  string description = 2;
  map<string, string> input = 3;
  string output = 4;
  bool read_only = 5;
  string risk = 6;
  string status = 7;
  string provider = 8;
  string reason = 9;
}

message ListCapabilitiesResponse {
  repeated CapabilityDefinition capabilities = 1;
  string trace_id = 2;
}

message A2AAgentConfig {
  string name = 1;
  string endpoint = 2;
  map<string, string> headers = 3;
  RiskLevel risk_level = 4;
}

message InternalAgentConfig {
  string id = 1;
  string name = 2;
  string prompt = 3;
  ModelConfig model = 4;
}

message SubAgentConfig {
  string id = 1;
  string name = 2;
  string description = 3;
  string prompt = 4;
  ModelConfig model = 5;
  repeated CapabilityConfig capabilities = 6;
  repeated Skill skills = 7;
  google.protobuf.Struct extra = 8;
  int32 max_iterations = 9;
  int32 timeout_ms = 10;
}

message KnowledgeBaseConfig {
  string id = 1;
  string name = 2;
  string retrieval_url = 3;
  string token = 4;
  int32 top_k = 5;
}

message FileConfig {
  string name = 1;
  string virtual_path = 2;
  int64 size = 3;
  string type = 4;
}

// ============================================================
// Shared result / metadata messages
// ============================================================
message ToolCall {
  string tool = 1;
  google.protobuf.Value input = 2;
  google.protobuf.Value output = 3;
}

message A2AResult {
  string agent_name = 1;
  string status = 2;
  google.protobuf.Value result = 3;
  string error = 4;
}

message ResponseMetadata {
  string model = 1;
  int64 latency_ms = 2;
  int32 tokens_used = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;
  int32 tool_calls_count = 6;
  int32 a2a_calls_count = 7;
  int32 skill_calls_count = 8;
  int32 iterations = 9;
  repeated ToolCallMetadata tool_calls_detail = 10;
  string error = 11;
}

message ToolCallMetadata {
  string tool = 1;
  google.protobuf.Value input = 2;
  google.protobuf.Value output = 3;
  int64 latency_ms = 4;
  bool success = 5;
  string error = 6;
}

message PendingApproval {
  string interrupt_id = 1;
  string tool_name = 2;
  string tool_type = 3;
  string arguments_json = 4;
  RiskLevel risk_level = 5;
  string description = 6;
}

message MemoryEntry {
  string name = 1;
  string description = 2;
  MemoryType type = 3;
  string content = 4;
  int32 importance = 5;
}

message BusinessError {
  BusinessErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> metadata = 4;
}

// ============================================================
// Streaming
// ============================================================
message StreamEvent {
  int64 seq = 1;
  google.protobuf.Timestamp emitted_at = 2;
  string trace_id = 3;
  oneof payload {
    MetaEvent meta = 10;
    DeltaEvent delta = 11;
    ToolCallEvent tool_call = 12;
    ToolResultEvent tool_result = 13;
    InterruptedEvent interrupted = 14;
    ErrorEvent error = 15;
    DoneEvent done = 16;
  }
}

message MetaEvent {
  google.protobuf.Timestamp started_at = 1;
  string stream_protocol = 2;
  string checkpoint_id = 3;
  google.protobuf.Timestamp heartbeat_at = 4;
}

message DeltaEvent {
  string text = 1;
  string role = 2;
  bool reasoning = 3;
}

message ToolCallEvent {
  string id = 1;
  string tool = 2;
  string tool_type = 3;
  google.protobuf.Struct input = 4;
}

message ToolResultEvent {
  string id = 1;
  string tool = 2;
  google.protobuf.Struct output = 3;
  bool success = 4;
  string error = 5;
  int64 latency_ms = 6;
}

message InterruptedEvent {
  string checkpoint_id = 1;
  repeated PendingApproval pending_approvals = 2;
}

message ErrorEvent {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message DoneEvent {
  string content = 1;
  string finish_reason = 2;
  google.protobuf.Timestamp finished_at = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;
  int32 total_tokens = 6;
  ResponseMetadata metadata = 7;
  repeated MemoryEntry memories = 8;
  string checkpoint_id = 9;
}

// VisualInput is transient device evidence for the current model turn.
message VisualInput {
  string id = 1;
  string mime_type = 2;
  bytes data = 3;
  string sha256 = 4;
  string purpose = 5;
  string detail = 6;
}
